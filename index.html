<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9f1fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%A5%B6%3C/text%3E%3C/svg%3E">
<title>Дожить до 18:00 · ЦАД</title>
<style>
:root{
  --bg:#e9f1fa;
  --panel:#ffffff;
  --panel-2:#f2f7fc;
  --line:#d2e0ef;
  --ink:#17263c;
  --muted:#6b83a0;
  --warm:#ef7d2b;
  --warm-2:#ffb35c;
  --warm-soft:#fdf1e6;
  --cold:#2f8fd0;
  --cold-soft:#eaf5fd;
  --bad:#d6475a;
  --good:#1f9e6b;
  --warn:#b8860b;
  --r:16px;
  --shadow:0 6px 18px rgba(28,60,100,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);font-size:16px;line-height:1.35;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
#app{
  position:relative;height:100dvh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);
  background:var(--bg);
}

/* ---------------- HUD ---------------- */
.hud{display:flex;align-items:center;gap:8px}
.office{
  font-weight:800;font-size:11px;letter-spacing:.14em;color:#2b6ea8;
  background:var(--cold-soft);border:1px solid #c5e1f6;border-radius:8px;padding:3px 7px;
}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:21px}
.daybar{flex:1;height:8px;border-radius:99px;background:#d9e6f4;overflow:hidden;position:relative}
.daybar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#7fc0ea,#2f8fd0);border-radius:99px;transition:width .3s linear}
.tempchip{
  font-weight:800;font-size:12px;color:#2b6ea8;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:4px 7px;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.icon-btn{
  width:34px;height:34px;flex:0 0 34px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:15px;font-weight:800;box-shadow:var(--shadow);
}

/* ---------------- тепло ---------------- */
.warmth{display:flex;align-items:center;gap:10px}
.avatar{
  font-size:30px;width:50px;height:50px;flex:0 0 50px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);
}
.avatar.shiver{animation:shiver .32s infinite}
.avatar.hot{animation:puff 1.6s infinite}
@keyframes shiver{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(1px,-1px) rotate(2deg)}}
@keyframes puff{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wbar{position:relative;flex:1;height:44px;border-radius:14px;background:#dce8f5;border:1px solid var(--line);overflow:hidden}
.wfill{position:absolute;inset:0 auto 0 0;width:70%;transition:width .25s linear,background .4s}
.wlabel{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;font-weight:800;font-size:13px;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  color:#20364f;pointer-events:none;
}

/* ---------------- раскладка: поле слева, приборы справа ---------------- */
.stage{display:flex;gap:8px;flex:1;min-height:0}
.sidebar{flex:0 0 76px;width:76px;display:flex;flex-direction:column;gap:8px;min-height:0}

/* карточка воздуха */
.rst{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px 7px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
}
.rst .ico{font-size:15px;line-height:1}
.rst .val{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.rst .cap{font-size:8px;color:var(--muted);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.rst .bar{position:absolute;left:8px;right:8px;bottom:5px;height:3px;border-radius:99px;background:#e3ecf6;overflow:hidden}
.rst .bar em{display:block;height:100%;width:50%;background:#5ec8a0;border-radius:99px;transition:width .4s,background .4s}
.rst.stuffy{background:#fdf3f5;border-color:#f2c4cc}
.rst.stuffy .val{color:#b8324a}
.rst.stuffy .bar em{background:#d6475a}

/* ---------------- комната ---------------- */
.scene{
  position:relative;flex:1;min-width:0;min-height:0;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow);
  background:linear-gradient(180deg,#f4f9fd 0%,#e8f1fa 62%,#deeaf6 100%);
}
.wallline{
  position:absolute;left:0;right:0;bottom:112px;height:1px;
  background:linear-gradient(90deg,rgba(120,160,200,0),rgba(120,160,200,.45),rgba(120,160,200,0));
}
.floor{
  position:absolute;left:0;right:0;bottom:0;height:112px;
  background:linear-gradient(180deg,#e6eef8,#d5e2f0);
}
.floor::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(120,160,200,.16) 0 1px,rgba(120,160,200,0) 1px 26px);
}

/* окно с форточкой */
.window{
  position:absolute;right:14px;bottom:238px;width:46%;height:152px;
  background:linear-gradient(180deg,#dff0fd,#cfe6fa);
  border:6px solid #fff;border-radius:10px;overflow:hidden;
  box-shadow:inset 0 0 0 1px #c8dcf0, 0 8px 18px rgba(40,80,130,.16);
  transition:box-shadow .3s;
}
.window.wants{box-shadow:inset 0 0 0 1px #c8dcf0, 0 0 0 3px rgba(239,125,43,.4), 0 8px 18px rgba(40,80,130,.16)}
.window .snowhill{
  position:absolute;left:-6%;right:-6%;bottom:-6px;height:42px;border-radius:50% 50% 0 0;
  background:#fff;box-shadow:0 -2px 6px rgba(120,160,200,.2);
}
.window .flake{position:absolute;top:-10px;font-size:11px;color:#a9cdec;animation:snowdrift linear infinite}
@keyframes snowdrift{from{transform:translateY(-12px)}to{transform:translateY(180px)}}
.window .frame-v{position:absolute;left:50%;top:0;bottom:0;width:6px;background:#fff;box-shadow:0 0 4px rgba(80,120,170,.25)}
.window .frame-h{position:absolute;left:0;right:0;top:52%;height:6px;background:#fff;box-shadow:0 0 4px rgba(80,120,170,.25)}
.vent{
  position:absolute;right:0;top:0;width:50%;height:52%;
  background:linear-gradient(180deg,#d8ecfd,#c4ddf6);
  border:4px solid #fff;border-top-right-radius:8px;border-bottom-left-radius:4px;
  transform-origin:right top;transform:perspective(420px) rotateY(0deg);
  transition:transform .7s cubic-bezier(.3,1.4,.4,1);transform-style:preserve-3d;
  box-shadow:-2px 2px 8px rgba(40,80,130,.18);
}
.vent.open{transform:perspective(420px) rotateY(-62deg)}
.vent .hintdot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;opacity:0;transition:opacity .3s}
.window.wants .vent .hintdot{opacity:1;animation:pulseDot 1s infinite}
@keyframes pulseDot{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}

/* плакат */
.poster{
  position:absolute;left:8px;top:34px;width:34%;padding:7px 8px;text-align:center;
  background:#fff;border:1px solid var(--line);border-radius:8px;transform:rotate(1.5deg);
  box-shadow:0 8px 16px rgba(40,80,130,.14);
  font-size:9px;letter-spacing:.08em;color:var(--muted);font-weight:800;text-transform:uppercase;
}
.poster b{display:block;font-size:12px;color:#2b425f;margin-top:2px;text-transform:none}
.poster span{display:block;font-size:8px;margin-top:3px;opacity:.7}

/* рабочий стол */
.desk{position:absolute;left:10px;bottom:98px;width:36%;height:84px;z-index:5}
.desk .top{position:absolute;left:0;right:0;top:0;height:13px;border-radius:6px;
  background:linear-gradient(180deg,#f7ece0,#dcc9b2);box-shadow:0 5px 12px rgba(40,80,130,.2)}
.desk .panel{position:absolute;left:6px;right:6px;top:12px;height:36px;
  background:linear-gradient(180deg,#e9dcc9,#d8c4a8);box-shadow:inset 0 6px 10px rgba(120,90,60,.14)}
.desk .legs{position:absolute;left:6px;right:6px;bottom:0;height:38px;display:flex;justify-content:space-between;padding:0 4px}
.desk .legs i{display:block;width:9px;height:100%;background:linear-gradient(180deg,#d8c4a8,#bfa88b);border-radius:0 0 3px 3px}
.desk .stuff{position:absolute;top:-22px;font-size:16px;line-height:1}
.desk .s1{left:6px;font-size:42px;top:-50px}
.desk .s2{left:44%}
.desk .s3{left:68%}

/* лампа под потолком: качается и светит конусом */
.lamp{
  position:absolute;left:50%;top:34px;margin-left:-46px;width:92px;height:150px;z-index:2;
  pointer-events:none;transform-origin:50% -34px;animation:sway 7s ease-in-out infinite;
}
@keyframes sway{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
.lamp .wire{position:absolute;left:50%;top:-34px;width:2px;height:38px;margin-left:-1px;background:#b3c3d5}
.lamp .shade{
  position:absolute;left:0;top:2px;width:92px;height:34px;
  background:linear-gradient(180deg,#cfdae7,#93a7be);
  clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);
  box-shadow:0 6px 14px rgba(40,80,130,.28);
  transition:background .5s;
}
.lamp .shade::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:6px;
  background:linear-gradient(180deg,rgba(255,214,150,.95),rgba(255,214,150,.1));
}
.lamp .bulb{
  position:absolute;left:50%;top:34px;width:18px;height:18px;margin-left:-9px;border-radius:50%;
  background:#ffe1a4;box-shadow:0 0 20px 8px rgba(255,206,118,.9), 0 0 44px 18px rgba(255,206,118,.45);
  transition:background .5s,box-shadow .5s;
}
.lamp .glow{
  position:absolute;left:50%;top:40px;margin-left:-165px;width:330px;height:330px;
  background:linear-gradient(180deg,rgba(255,212,132,.6) 0%,rgba(255,212,132,.26) 42%,rgba(255,212,132,0) 100%);
  clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);
  filter:blur(2px);transition:opacity .6s;
}
.lamp.off .glow{opacity:0}
.lamp.off .shade{background:linear-gradient(180deg,#c2cddb,#a2b0c1)}
.lamp.off .shade::after{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}
.lamp.off .bulb{background:#c6d0dc;box-shadow:none}
/* пелена перегрева: в шапке обзор хуже */
.heatmask{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity .7s;
  background:radial-gradient(118% 92% at 50% 42%, rgba(255,150,90,0) 34%, rgba(255,124,58,.30) 76%, rgba(206,66,30,.58) 100%);}
.scene.hatted .heatmask{opacity:1}
.scene.hatted .desk,.scene.hatted .radwrap,.scene.hatted .heater,.scene.hatted .lamp,
.scene.hatted .wallclock,.scene.hatted .poster,.scene.hatted .picture,.scene.hatted .plant,
.scene.hatted .colleague,.scene.hatted .visitor,.scene.hatted .socket{filter:blur(.9px) saturate(1.08)}
.scene.dizzy .heatmask{opacity:1;animation:wobble 4.4s ease-in-out infinite}
.scene.dizzy .desk,.scene.dizzy .radwrap,.scene.dizzy .heater,.scene.dizzy .lamp,
.scene.dizzy .wallclock,.scene.dizzy .poster,.scene.dizzy .picture,.scene.dizzy .colleague{filter:blur(1.5px) saturate(1.12)}
@keyframes wobble{
  0%,100%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(3px,-2px) rotate(.35deg)}
  50%{transform:translate(-2px,2px) rotate(-.3deg)}
  75%{transform:translate(2px,1px) rotate(.2deg)}
}
/* шапка на герое */
.player .hat{position:absolute;left:50%;top:6px;width:52px;height:34px;transform:translateX(-50%) translateY(-14px) scaleY(.55);
  transform-origin:50% 100%;opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.player .hat::before{content:'';position:absolute;left:2px;right:2px;top:0;bottom:7px;
  border-radius:52% 52% 16% 16% / 88% 88% 22% 22%;
  background:linear-gradient(180deg,#e8836d,#c9523f 62%,#b04534);
  box-shadow:inset -6px -4px 0 rgba(0,0,0,.10), inset 6px 3px 0 rgba(255,255,255,.14);}
.player .hat::after{content:'';position:absolute;left:1px;right:1px;bottom:0;height:10px;border-radius:7px;
  background:linear-gradient(180deg,#f0927c,#cb5a46);box-shadow:0 2px 5px rgba(90,40,30,.32)}
.player.wearing .hat{opacity:1;transform:translateX(-50%) translateY(0) scaleY(1)}
.darkmask{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .8s;
  background:radial-gradient(120% 90% at 50% 0%, rgba(10,18,34,.42), rgba(8,14,28,.72))}
.scene.dark .darkmask{opacity:1}

/* большой термометр на стене */
/* термометр — отдельный блок справа от поля */
.thermo{
  position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 5px 7px;background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;
}
.thermo .tcap{
  font-size:7.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;
}
.thermo .val{font-size:19px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#22354d}
.thermo .tube{
  position:relative;flex:1;width:18px;margin-top:2px;border-radius:9px 9px 22px 22px;overflow:hidden;
  background:linear-gradient(90deg,#eef4fa,#fff 45%,#eef4fa);
  box-shadow:inset 0 0 0 1px #d6e2ef;
  display:flex;align-items:flex-end;
}
.thermo .tube::after{
  content:'';position:absolute;inset:6px 1px 12px 2px;width:5px;border-radius:2px;opacity:.55;
  background:repeating-linear-gradient(180deg,#b9cbdd 0 1px,rgba(0,0,0,0) 1px 8px);
}
.thermo .merc{
  width:100%;height:45%;border-radius:0 0 9px 9px;
  background:linear-gradient(180deg,#ffc46b,#ef7d2b);transition:height .5s,background .5s;
}
.thermo .bulb{
  width:22px;height:22px;border-radius:50%;margin-top:-6px;background:#ef7d2b;
  border:2px solid #fff;box-shadow:0 4px 10px rgba(40,80,130,.22);transition:background .5s;
}
.thermo.cold .merc,.thermo.cold .bulb{background:linear-gradient(180deg,#9fd8f5,#4aa8e0);background-color:#4aa8e0}
.thermo.hot .merc,.thermo.hot .bulb{background:linear-gradient(180deg,#ff9a45,#d94a1e);background-color:#d94a1e}

/* часы на стене (ПК) */
.wallclock{display:none}
.wallclock::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#ffffff,#eaf2fa)}
.wallclock i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#2b425f;border-radius:2px}
.wallclock .hh{width:4px;height:22px;margin-left:-2px}
.wallclock .mm{width:3px;height:31px;margin-left:-1.5px;background:#5a7391}
.wallclock b{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#ef7d2b}

/* обогреватель и розетка */
.socket{
  position:absolute;left:41%;bottom:176px;width:24px;height:28px;z-index:2;
  border-radius:5px;background:#f4f7fb;border:2px solid #fff;
  box-shadow:inset 0 0 0 1px var(--line), 0 4px 10px rgba(40,80,130,.14);
}
.socket::before,.socket::after{
  content:'';position:absolute;left:50%;width:4px;height:7px;margin-left:-2px;border-radius:2px;background:#b9cbdd;
}
.socket::before{top:8px}
.socket::after{top:18px}
.heaterObj{
  position:absolute;left:40%;bottom:112px;width:44px;height:42px;z-index:3;
  border-radius:8px;background:linear-gradient(180deg,#eef3f9,#dde6f0);
  border:1px solid var(--line);box-shadow:0 6px 14px rgba(40,80,130,.18);
  transition:box-shadow .5s,border-color .5s;
}
.heaterObj .bars{position:absolute;inset:7px 6px 6px;display:flex;gap:4px}
.heaterObj .bars i{flex:1;border-radius:3px;background:#c8d5e4;box-shadow:inset 0 0 4px rgba(80,110,150,.3);transition:background .4s,box-shadow .4s}
.heaterObj .cord{
  position:absolute;left:50%;bottom:100%;width:2px;height:20px;margin-left:-1px;
  background:linear-gradient(180deg,#cfdbe8,#c1d0e0);border-radius:2px;
}
.heaterObj .plug{
  position:absolute;left:50%;bottom:calc(100% + 8px);width:18px;height:13px;margin-left:-9px;
  border-radius:4px;background:#e9f0f7;border:1px solid #c3d1e0;
  transform-origin:50% 100%;transform:rotate(26deg);
  transition:transform .5s cubic-bezier(.3,1.4,.4,1),bottom .5s cubic-bezier(.3,1.4,.4,1),background .4s;
}
.heaterObj .plug i{
  position:absolute;top:-6px;width:3px;height:7px;border-radius:1px;background:#b9cbdd;transition:background .4s;
}
.heaterObj .plug i:first-child{left:4px}
.heaterObj .plug i:last-child{right:4px}
.heaterObj.on .plug{transform:rotate(0deg);bottom:calc(100% + 22px);background:#ffd9b5;border-color:#efb37e}
.heaterObj.on .plug i{background:#ef7d2b}
.heaterObj.on{border-color:#f0b378;box-shadow:0 6px 20px rgba(239,125,43,.35)}
.heaterObj.on .bars i{background:linear-gradient(180deg,#ffb35c,#ef7d2b);box-shadow:0 0 12px rgba(239,125,43,.8)}

.heaterObj.dead{opacity:.5;filter:grayscale(.6)}
.heaterObj.hintme::after{
  content:'👆';position:absolute;left:50%;top:-46px;transform:translateX(-50%);
  font-size:14px;animation:pulseDot 1s infinite;
}

/* растение на столе */
.plant{position:absolute;left:96px;bottom:186px;font-size:26px;line-height:1;z-index:6;
  filter:drop-shadow(0 5px 6px rgba(40,80,130,.2))}

/* дверь */
/* картина на стене */
.picture{position:absolute;left:18px;bottom:326px;width:86px;height:72px;z-index:1;pointer-events:none}
.picture .frame{
  position:absolute;inset:0;padding:4px;border-radius:5px;
  background:linear-gradient(180deg,#f7f1e6,#e3d5bf);
  box-shadow:0 8px 16px rgba(40,80,130,.2), inset 0 0 0 1px rgba(150,130,105,.35);
}
.picture .sky{
  position:relative;display:block;width:100%;height:100%;overflow:hidden;border-radius:2px;
  background:linear-gradient(180deg,#d6ecfd,#eef7ff);
}
.picture .sun{
  position:absolute;right:14%;top:12%;width:11px;height:11px;border-radius:50%;
  background:#ffd166;box-shadow:0 0 10px rgba(255,200,90,.85);
}
.picture .hill{
  position:absolute;bottom:-6px;border-radius:50% 50% 0 0;
}
.picture .hill.back{left:18%;width:56%;height:34px;background:linear-gradient(180deg,#bfe0f5,#a8cfe8)}
.picture .hill.front{left:-8%;width:74%;height:26px;background:linear-gradient(180deg,#a9d6ef,#8fc3e3)}
.picture .tree{
  position:absolute;right:16%;bottom:6px;width:0;height:0;border-left:6px solid transparent;
  border-right:6px solid transparent;border-bottom:16px solid #7fb08c;
}

/* персонажи — декорации, тапы не перехватывают */
.player,.colleague,.visitor,.plant,.picture,.socket,.wallclock{pointer-events:none}

/* персонажи */
.player{
  position:absolute;left:50px;bottom:210px;font-size:78px;line-height:1;z-index:4;
  filter:drop-shadow(0 6px 8px rgba(40,80,130,.22));
}
.player.shiver{animation:shiver .3s infinite}
.player.hot{animation:puff 1.6s infinite}
.colleague{
  position:absolute;left:30%;bottom:112px;font-size:150px;line-height:1;z-index:6;
  filter:drop-shadow(0 6px 8px rgba(40,80,130,.22));
  transition:left 2.6s cubic-bezier(.4,0,.5,1),transform .3s;
}
.visitor{
  position:absolute;left:-30%;bottom:112px;font-size:200px;line-height:1;z-index:7;
  opacity:0;filter:drop-shadow(0 6px 8px rgba(40,80,130,.22));
  transition:left 2.6s cubic-bezier(.4,0,.5,1),opacity .35s;
}
.visitor.in{left:34%;opacity:1}
.visitor.walking{animation:walkBob .42s infinite}
.visitor.gone{left:-30%;opacity:0}
.colleague.flip .face{display:inline-block;transform:scaleX(-1)}
.colleague.seated{transform:scale(.82);transform-origin:50% 100%}
.colleague.seated{transform:scale(.82);transform-origin:50% 100%}
.colleague.walking{animation:walkBob .42s infinite}
@keyframes walkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* батарея */
.radwrap{position:absolute;right:12px;bottom:112px}
.radiator{position:relative;width:138px;height:104px}
.radiator .fins{
  position:absolute;inset:12px 0;border-radius:7px;
  background:repeating-linear-gradient(90deg,#e3ebf4 0 9px,#cfdbe9 9px 15px),#dfe8f2;
  box-shadow:inset 0 0 14px rgba(90,130,175,.28), 0 6px 14px rgba(40,80,130,.18);
  transition:background .7s, box-shadow .7s;
}
.radiator .fins::before,.radiator .fins::after{
  content:'';position:absolute;left:-4%;right:-4%;height:9px;border-radius:6px;
  background:linear-gradient(180deg,#e7eef6,#c9d6e5);box-shadow:0 2px 5px rgba(40,80,130,.2);transition:background .7s;
}
.radiator .fins::before{top:-11px}
.radiator .fins::after{bottom:-11px}
.radiator.hot .fins{
  background:repeating-linear-gradient(90deg,#f7a05c 0 9px,#e07f36 9px 15px),#ef8f45;
  box-shadow:inset 0 0 18px rgba(255,190,120,.9), 0 6px 18px rgba(224,127,54,.4);
}
.radiator.hot .fins::before,.radiator.hot .fins::after{background:linear-gradient(180deg,#f9ad6c,#e07f36)}
.radiator.cold .fins{
  background:repeating-linear-gradient(90deg,#eaf3fc 0 9px,#cfe2f4 9px 15px),#dcebf9;
  box-shadow:inset 0 0 18px rgba(120,190,245,.5), 0 6px 14px rgba(40,80,130,.12);
}
.radiator.bubble{animation:bubbleShake .2s infinite}
@keyframes bubbleShake{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,0) rotate(.3deg)}}
.radiator .steam{position:absolute;inset:-6px 0 0;opacity:0;transition:opacity .6s;pointer-events:none}
.radiator.hot .steam{opacity:1}
.radiator .steam i{
  position:absolute;bottom:56%;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,196,130,.9),rgba(255,196,130,0) 70%);
  animation:rise 3.2s infinite ease-out;
}
.radiator .steam i:nth-child(1){left:12%;animation-delay:0s}
.radiator .steam i:nth-child(2){left:42%;animation-delay:1.1s}
.radiator .steam i:nth-child(3){left:70%;animation-delay:2.2s}
@keyframes rise{0%{transform:translateY(10px) scale(.6);opacity:0}25%{opacity:.95}100%{transform:translateY(-80px) scale(1.7);opacity:0}}
.radiator .wind{position:absolute;inset:-10px 0;border-radius:10px;opacity:0;transition:opacity .6s;pointer-events:none;
  background-image:repeating-linear-gradient(115deg,rgba(90,175,230,.24) 0 2px,rgba(90,175,230,0) 2px 24px);
  animation:windMove 1.5s linear infinite}
.radiator.cold .wind,.radiator.windy .wind{opacity:1}
@keyframes windMove{to{background-position:56px 0}}
.radiator .drip{position:absolute;inset:0;opacity:0;transition:opacity .4s;pointer-events:none}
.radiator.bubble .drip{opacity:1}
.radiator .drip i{position:absolute;top:24%;width:4px;height:9px;border-radius:60% 60% 45% 45%;background:#5fb0dd;animation:fall 1.8s infinite}
.radiator .drip i:nth-child(1){left:24%;animation-delay:.2s}
.radiator .drip i:nth-child(2){left:50%;animation-delay:.8s}
.radiator .drip i:nth-child(3){left:74%;animation-delay:1.4s}
@keyframes fall{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(54px);opacity:0}}
.radiator .frost{position:absolute;inset:-10px 0;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .6s;
  background:
    radial-gradient(14px 14px at 14% 24%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
    radial-gradient(18px 18px at 78% 34%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%),
    radial-gradient(12px 12px at 46% 76%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%);
}
.rad-label{
  position:absolute;right:16px;bottom:112px;width:98px;text-align:right;z-index:4;
  font-weight:800;font-size:10px;letter-spacing:.12em;color:var(--muted);
  background:rgba(255,255,255,.86);border-radius:7px;padding:3px 5px;
}
.rad-label.hot{color:#d9722a}
.rad-label.cold{color:#2b7fb8}
.rad-label.bubble{color:#a8780e}

/* реплика игрока */
/* реплика растёт прямо из смайлика */
.say{
  position:absolute;left:66%;bottom:92%;z-index:9;display:none;
  width:max-content;max-width:158px;padding:7px 11px;
  background:#eef6ff;border:1px solid #c8e0f4;border-radius:14px 14px 14px 4px;
  font-size:13px;font-weight:700;line-height:1.3;color:#1f4467;white-space:normal;
  box-shadow:0 8px 18px rgba(30,70,120,.16);pointer-events:none;
}
.say::after{
  content:'';position:absolute;left:9px;bottom:-8px;width:13px;height:13px;background:#eef6ff;
  border-right:1px solid #c8e0f4;border-bottom:1px solid #c8e0f4;
  transform:rotate(45deg);border-radius:0 0 3px 0;
}
.say.show{display:block;animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
/* реплика коллеги — в свою сторону (влево) и ниже, другим цветом */
.say-colleague{
  left:auto;right:62%;bottom:34%;max-width:150px;
  background:#fff7ec;border-color:#f2d8b6;color:#7a4a1c;border-radius:14px 14px 4px 14px;
}
.say-colleague::after{
  left:auto;right:9px;bottom:-8px;background:#fff7ec;
  border-right:0;border-bottom:0;border-left:1px solid #f2d8b6;border-top:1px solid #f2d8b6;
  border-radius:3px 0 0 0;
}
/* реплика начальника — справа сверху, своим цветом */
.say-visitor{
  left:66%;bottom:82%;max-width:170px;
  background:#f2eefb;border-color:#d6cdf0;color:#4b3a7a;border-radius:14px 14px 14px 4px;
}
.say-visitor::after{
  left:9px;bottom:-8px;background:#f2eefb;
  border-right:1px solid #d6cdf0;border-bottom:1px solid #d6cdf0;
}
@keyframes pop{0%{transform:scale(.85) translateY(8px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}

/* статусы */
.chips{position:absolute;left:0;right:0;top:8px;z-index:10;display:flex;flex-wrap:wrap;gap:6px;padding:0 12px}
.chip{
  font-size:10px;font-weight:800;letter-spacing:.03em;padding:4px 8px;border-radius:99px;
  background:#fff;border:1px solid var(--line);color:var(--muted);box-shadow:0 3px 8px rgba(30,70,120,.08);
}
.chip.bad{color:#b8324a;border-color:#f0c3cb;background:#fdeef1}
.chip.good{color:#177a53;border-color:#bde6d4;background:#eaf8f1}
.chip.warm{color:#c4661f;border-color:#f5d3b1;background:var(--warm-soft)}

/* всплывашки */
.toasts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.toast{
  position:absolute;left:50%;bottom:352px;transform:translateX(-50%);
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 12px;
  font-size:13px;font-weight:700;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 10px 22px rgba(30,70,120,.18);animation:fly 3.4s cubic-bezier(.2,.8,.3,1) forwards;color:#23384f;
}
.toast.good{border-color:#b9e5d2;color:#16764f;background:#f2fbf7}
.toast.bad{border-color:#f2c4cc;color:#b8324a;background:#fdf3f5}
.toast.warn{border-color:#f0dcaa;color:#946d07;background:#fdf8ea}
@keyframes fly{0%{opacity:0;transform:translate(-50%,14px) scale(.92)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px) scale(.96)}}

/* ---------------- кнопки ---------------- */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{
  position:relative;min-height:60px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-family:inherit;font-weight:800;font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:6px 4px;box-shadow:var(--shadow);overflow:hidden;
}
.btn .em{font-size:19px;line-height:1}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;box-shadow:none}
.btn.on{border-color:#f5cda6;background:var(--warm-soft);color:#b95f18}
.btn.pulse{animation:pulse .5s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,125,43,.5)}100%{box-shadow:0 0 0 14px rgba(239,125,43,0)}}
.btn .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(47,143,208,.16);transition:height .12s linear}

/* ---------------- оверлеи ---------------- */
.overlay{
  position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(226,238,249,.86);backdrop-filter:blur(4px);
}
.overlay.show{display:flex;animation:fadeIn .18s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{
  width:100%;max-height:100%;overflow:auto;background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:18px;box-shadow:0 22px 50px rgba(28,60,100,.22);
}
.card h2{margin:0 0 4px;font-size:19px;line-height:1.2}
.card p{margin:0 0 12px;color:var(--muted);font-size:14px}
.opt{
  display:block;width:100%;text-align:left;min-height:52px;margin-bottom:8px;padding:12px 14px;
  border-radius:14px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  font-family:inherit;font-size:15px;font-weight:700;
}
.opt small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.opt:active{transform:scale(.99)}
.opt.primary{border-color:#f5cda6;background:var(--warm-soft)}
.cta{
  width:100%;min-height:54px;margin-top:6px;border-radius:16px;border:0;font-family:inherit;
  font-weight:900;font-size:16px;color:#fff;background:linear-gradient(180deg,#ff9a45,#ef7d2b);
  box-shadow:0 8px 18px rgba(239,125,43,.32);
}
.cta.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.cta:active{transform:scale(.98)}

/* тайминг-шкала */
.timing{position:relative;height:52px;border-radius:14px;background:#eef5fc;border:1px solid var(--line);overflow:hidden;margin:10px 0}
.timing .zone{position:absolute;top:0;bottom:0;background:rgba(31,158,107,.3);border-radius:6px}
.timing .mk{position:absolute;top:-3px;bottom:-3px;width:4px;background:#ef7d2b;box-shadow:0 0 10px rgba(239,125,43,.8);border-radius:2px}
.tries{display:flex;gap:6px;justify-content:center;align-items:center;min-height:22px;margin-bottom:8px;font-size:16px;color:var(--muted);font-weight:700}
.tries .hintline{font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* мессенджер (кадры и т.п.) */
.messenger{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;background:#f7fbff}
.msgr-head{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line)}
.msgr-head .ava{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--cold-soft);
  display:grid;place-items:center;font-size:16px;border:1px solid #cde3f5}
.msgr-head b{display:block;font-size:14px;line-height:1.2}
.msgr-head span{display:block;font-size:11px;color:var(--good);font-weight:700}
.msgr-body{padding:12px;display:flex;flex-direction:column;gap:7px;max-height:230px;overflow:auto}
.bubble{
  max-width:86%;padding:8px 11px;font-size:14px;font-weight:600;line-height:1.3;
  background:#e9f2fb;border:1px solid #d5e6f6;border-radius:14px 14px 14px 4px;color:#22354d;
  animation:msgIn .38s both;
}
.bubble.me{align-self:flex-end;background:#eaf8f1;border-color:#c8e8d9;border-radius:14px 14px 4px 14px;color:#186b4c}
.bubble.typing{color:var(--muted);font-style:italic}
@keyframes msgIn{from{opacity:0;transform:translateY(7px) scale(.97)}to{opacity:1;transform:none}}

/* правила плитками */
.rulegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.rule{background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:10px}
.rule span{font-size:20px;line-height:1;display:block;margin-bottom:5px}
.rule b{display:block;font-size:13px;margin-bottom:2px}
.rule i{font-style:normal;font-size:12px;color:var(--muted);font-weight:600;line-height:1.3;display:block}
@media (min-width:820px){.rulegrid{grid-template-columns:1fr 1fr 1fr}}

/* коридор */
.walk{position:relative;text-align:center;padding:6px 0}
.walk .walker{font-size:42px;animation:walkStep 1.1s infinite ease-in-out}
@keyframes walkStep{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}
.walk .wline{min-height:44px;margin-top:4px;font-size:15px;font-weight:800;color:#22354d}
.walk .snow{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.walk .snow i{position:absolute;top:-10px;font-size:12px;color:#a9cdec;animation:snowfall linear infinite}
@keyframes snowfall{0%{transform:translateY(-14px);opacity:0}15%{opacity:1}100%{transform:translateY(320px);opacity:0}}

/* результат */
.result-emoji{font-size:56px;text-align:center;line-height:1;margin-bottom:6px}
.title-big{font-size:23px;font-weight:900;text-align:center;margin:0 0 4px}
.subtitle{text-align:center;color:var(--muted);font-weight:700;margin-bottom:14px;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:11px;font-weight:700}
.quote{background:#f4f7fb;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;font-weight:700;margin-bottom:14px}
.share-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.share-row .cta{margin:0;font-size:14px;min-height:50px}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:8px;min-height:16px}
.rules{font-size:14px;color:#3c5673;padding-left:18px;margin:0 0 10px}
.rules li{margin-bottom:6px}
.rules b{color:var(--ink)}

<body>

<script>
(function(){
'use strict';

/* ============================ КОНФИГ ============================ */
var CFG = {
  OFFICE: 'МТО',
  DAY_START: 9*60,
  DAY_END: 18*60,
  MS_PER_MIN: 150,          // ~1,35 мин реального времени на весь день
  START_WARMTH: 70
};

var RAD = {
  cold:   { label:'ЛЕДЯНАЯ',                  rate:-0.41 },
  low:    { label:'ЧУТЬ ТЁПЛАЯ',              rate:-0.18 },
  hot:    { label:'ГОРЯЧАЯ',                  rate:+0.12 },
  bubble: { label:'ШУМИТ · ВОЗДУШНАЯ ПРОБКА', rate:-0.24 }
};

var ACT = {
  tea:     { cd:20000, gain:+5 },
  squats:  { cd:17000, gain:+3 },
  breathe: { cd:8000,  gain:+1 }
};

var AMBIENT = [
  'Это не дрожь, это я быстро печатаю',
  'Клавиатура холодная как совесть',
  'Я не мёрзну, я закаляюсь',
  'Пальцы не гнутся, но отчёт сдан',
  'Дышу на руки как дракон, только грустный',
  'В термокружке чай остыл за 40 секунд',
  'На мне два свитера и один плед',
  'Печатаю в перчатках, не спрашивайте',
  'Сижу как сурикат — в позе максимального сохранения тепла',
  'Мышка холодная, рука синяя',
  'Считаю вдохи в шарф, чтобы не заснуть',
  'Чайник кипячу второй раз за десять минут',
  'Ноги замёрзли, зато эргономика',
  'У меня уже не мурашки, а мурашки-стажёры',
  'Кружка работает как грелка ровно две минуты'
];
var CORRIDOR = [
  'Коридор — это отдельный климат',
  'В коридоре минус, шарф как смысл жизни',
  'Пробежал мимо батареи — она холодная, как обычно',
  'По дороге замёрзли даже мысли',
  'Сквозняк у лестницы прямо в душу',
  'На стене висит график отопления за 2019 год',
  'Дверь на улицу открыта «на минуточку» уже час',
  'Прошёл мимо котельной — там смеются',
  'Встретил коллегу в пуховике — мы поняли друг друга',
  'Объявление на стене: «Тепло будет. Наверное»',
  'Плитка холодная, иду на цыпочках'
];
var HOT_LINES = ['БАТАРЕЯ ТЁПЛАЯ! Отмечаем!','Тепло! Не двигайся, не спугни','Ощущение лета','Радиатор жив! Он жив!'];
var COLD_LINES = ['Отопление «на профилактике»','Холодно. Совсем.','Батарея ледяная, как и планы','Тепло закончилось, но не для всех'];
var COLLEAGUE_LINES = {
  window: ['Подышать же надо!','Тут душно, я на минуточку','Форточка — это святое','Воздух нужен свежий'],
  radiator: ['У батареи теплее','Я тут постою','Тут хоть что-то греет','Занимай место, я потом'],
  pass: ['Я быстро','Туда-сюда','Кто-то выключил обогреватель','Опять совещание']
};

/* ============================ СОСТОЯНИЕ ============================ */
var S;
function resetState(){
  S = {
    t:0,
    warmth:CFG.START_WARMTH,
    lastReal:0,
    rad:'low', radLeft:rand(35,60),
    vent:false,
    effects:[],
    hat:false, overheat:0, overheatStage:0,
    paused:false, over:null,
    walk:null,
    col:{ target:36, walking:false, flip:false, timer:rand(20,34), mood:'pass' },
    visitorIn:false,
    heaterOn:false, heaterBanned:0, fine:0, heaterMin:0, fineRate:0,
    roomT:19, o2:100, darkUntil:0,
    cds:{tea:0,squats:0,breathe:0},
    nextEventAt:rand(210,330),
    nextAmbientAt:rand(10,18),
    nextSpeechAt:rand(6,12),
    stat:{tea:0,squats:0,breathe:0,knocks:0,misses:0,corridors:0,hatMin:0,awkward:0,career:0,
          minWarmth:CFG.START_WARMTH,maxWarmth:CFG.START_WARMTH,events:0,timings:0,timingHits:0,ventFixes:0,ventFights:0,visits:0,blackouts:0,
          maxRoomT:19,minO2:100,maxFine:0},
    ended:null
  };
}

/* ============================ УТИЛИТЫ ============================ */
function rand(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rand(a,b+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function $(id){ return document.getElementById(id); }
function fmtTime(min){
  var total = CFG.DAY_START + Math.floor(min), h = Math.floor(total/60), m = total%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function money(v){
  return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
}
function fmtDur(min){
  var m = Math.max(0, Math.round(min)), h = Math.floor(m/60);
  return h>0 ? (h+' ч '+(m%60)+' мин') : (m+' мин');
}
function vib(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

/* ============================ DOM ============================ */
var el = {};
function cacheEl(){
  el.clock=$('clock'); el.dayfill=$('dayfill'); el.wfill=$('wfill'); el.wval=$('wval');
  el.avatar=$('avatar'); el.rad=$('radiator'); el.radLabel=$('radLabel'); el.frost=$('frost');
  el.chips=$('chips'); el.toasts=$('toasts'); el.speech=$('speech');
  el.overlay=$('overlay'); el.card=$('card'); el.btnHat=$('btnHat'); el.btnKnock=$('btnKnock');
  el.btnWindow=$('btnWindow'); el.officeName=$('officeName'); el.outTemp=$('outTemp');
  el.windowEl=$('window'); el.vent=$('vent'); el.player=$('player'); el.colleague=$('colleague');
  el.visitor=$('visitor'); el.wcH=$('wcH'); el.wcM=$('wcM');
  el.playerFace=$('playerFace'); el.colleagueSay=$('colleagueSay'); el.visitorSay=$('visitorSay');
  el.colleagueFace=$('colleagueFace');
  el.heaterObj=$('heaterObj'); el.plug=$('plug');
  el.scene=$('scene'); el.lamp=$('lamp'); el.thermo=$('thermo'); el.thermoMerc=$('thermoMerc');
  el.thermoBulb=$('thermoBulb'); el.thermoVal=$('thermoVal');
  el.rstT=$('rstT'); el.rstTval=$('rstTval'); el.rstTbar=$('rstTbar');
  el.rstO=$('rstO2'); el.rstOval=$('rstOval'); el.rstObar=$('rstObar');
  el.btns = Array.prototype.slice.call(document.querySelectorAll('.btn'));
}
var sayTimers = {};
function sayInto(node, key, text){
  if(!node) return;
  node.textContent = text;
  node.classList.remove('show');
  void node.offsetWidth;
  node.classList.add('show');
  clearTimeout(sayTimers[key]);
  sayTimers[key] = setTimeout(function(){ node.classList.remove('show'); }, 19000);
}
function speech(text){ sayInto(el.speech, 'me', text); }
function colleagueSay(text){ sayInto(el.colleagueSay, 'col', text); }
function visitorSay(text){ sayInto(el.visitorSay, 'vis', text); }
function toast(text, kind){
  var d = document.createElement('div');
  d.className = 'toast' + (kind ? ' '+kind : '');
  d.textContent = text;
  d.style.bottom = (344 + Math.random()*46) + 'px';
  el.toasts.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 3600);
}
function avatarFor(w){
  if(w<=8) return '🥶';
  if(w<=28) return '😖';
  if(w<=48) return '😐';
  if(w<=70) return '🙂';
  if(w<=88) return '😅';
  return '🥵';
}
function outsideTemp(){
  var v = -6 - (S.t/(CFG.DAY_END-CFG.DAY_START))*7 + Math.sin(S.t/37)*1.4;
  return String(Math.round(v)).replace('-', '\u2212') + '\u00b0';
}
function getEff(id){
  for(var i=0;i<S.effects.length;i++) if(S.effects[i].id===id) return S.effects[i];
  return null;
}
function setEff(id,label,rate,minutes){
  var e = getEff(id);
  if(e){ e.until = S.t+minutes; e.rate = rate; e.label = label; }
  else S.effects.push({id:id,label:label,rate:rate,until:S.t+minutes});
}
function delEff(id){ S.effects = S.effects.filter(function(e){ return e.id !== id; }); }
function effectsRates(){
  var r = RAD[S.rad].rate;
  S.effects.forEach(function(e){ r += e.rate; });
  return r;
}

/* ============================ РЕНДЕР ============================ */
var lastRendered = {rad:'', chips:''};
function render(){
  if(!el.clock) return;
  var pct = clamp(S.warmth,0,100);
  el.clock.textContent = fmtTime(S.t);
  el.dayfill.style.width = clamp(S.t/(CFG.DAY_END-CFG.DAY_START)*100,0,100)+'%';
  if(el.outTemp) el.outTemp.textContent = outsideTemp();
  if(el.wcM){
    var mins = CFG.DAY_START + S.t;
    el.wcM.style.transform = 'rotate(' + ((mins % 60) / 60 * 360).toFixed(1) + 'deg)';
    el.wcH.style.transform = 'rotate(' + (((mins / 60) % 12) / 12 * 360).toFixed(1) + 'deg)';
  }

  el.wfill.style.width = pct+'%';
  var col;
  if(pct<25) col = 'linear-gradient(90deg,#8fcdf3,#5fb6e8)';
  else if(pct<50) col = 'linear-gradient(90deg,#a8dcf2,#7fc9e6)';
  else if(pct<75) col = 'linear-gradient(90deg,#ffd9a8,#ffbe74)';
  else col = 'linear-gradient(90deg,#ffc07a,#ef7d2b)';
  el.wfill.style.background = col;
  el.wval.textContent = Math.round(pct)+'%';

  var av = avatarFor(pct);
  [el.avatar, el.playerFace].forEach(function(node){
    if(!node) return;
    if(node.textContent !== av) node.textContent = av;
  });
  [el.avatar, el.player].forEach(function(node){
    if(!node) return;
    node.classList.toggle('shiver', pct<=25);
    node.classList.toggle('hot', pct>=88);
  });
  if(el.heaterObj){
    el.heaterObj.classList.toggle('on', S.heaterOn);
    el.heaterObj.classList.toggle('dead', S.t < S.heaterBanned);
    el.heaterObj.classList.toggle('hintme', S.t < 60 && !S.heaterOn);
  }

  var radKey = S.rad + (S.vent ? '+vent' : '');
  if(lastRendered.rad !== radKey){
    el.rad.className = 'radiator ' + S.rad + (S.vent ? ' windy' : '');
    el.radLabel.className = 'rad-label ' + S.rad;
    el.radLabel.textContent = RAD[S.rad].label;
    lastRendered.rad = radKey;
  }
  el.frost.style.opacity = Math.max(clamp((35-pct)/35,0,1)*0.9, S.rad==='cold' ? 0.5 : 0);

  // термометр в комнате
  var tPct = clamp((S.roomT - 10) / 24, 0, 1);
  var tCls = S.roomT >= 26 ? 'hot' : (S.roomT < 16 ? 'cold' : '');
  if(el.thermoMerc){
    el.thermoMerc.style.height = (12 + tPct * 88).toFixed(1) + '%';
    el.thermoVal.textContent = Math.round(S.roomT) + '°';
    el.thermo.className = 'thermo ' + tCls;
  }
  // панель: температура и воздух
  if(el.rstT){
    el.rstTval.textContent = Math.round(S.roomT) + '°';
    el.rstTbar.style.width = clamp((S.roomT - 10) / 24, 0, 1) * 100 + '%';
    el.rstT.className = 'rst ' + (S.roomT >= 26 ? 'hot' : S.roomT >= 23 ? 'warmish' : S.roomT < 16 ? 'chilly' : 'ok');
  }
  if(el.rstO){
    el.rstOval.textContent = Math.round(S.o2) + '%';
    el.rstObar.style.width = clamp((S.o2 - 35) / 65, 0, 1) * 100 + '%';
    el.rstO.className = 'rst ' + (S.o2 < 75 ? 'stuffy' : 'ok');
  }
  // свет
  var dark = S.darkUntil > S.t;
  if(el.lamp) el.lamp.classList.toggle('off', dark);
  if(el.scene) el.scene.classList.toggle('dark', dark);

  el.vent.classList.toggle('open', S.vent);
  el.windowEl.classList.toggle('wants', S.vent);
  el.btnWindow.disabled = !S.vent;

  var chips = [];
  if(S.vent) chips.push(['🧊 Форточка открыта', 'bad']);
  if(getEff('heater')) chips.push(['🔥 Обогреватель', 'warm']);
  if(getEff('meeting')) chips.push(['📋 Совещание', 'bad']);
  if(getEff('reception')) chips.push(['🚪 Ресепшен у двери', 'bad']);
  if(S.hat) chips.push(['🧣 Шапка −22% · перегрев '+Math.round(S.overheat)+'%',
                        S.overheat >= 70 ? 'bad' : (S.overheat >= 45 ? 'warm' : 'good')]);
  if(dark) chips.push(['🕯 Света нет', 'bad']);
  if(S.heaterOn) chips.push(['💸 '+money(S.fineRate)+'/мин · счёт '+money(S.fine), 'warm']);
  else if(S.fine > 0) chips.push(['💸 Штраф: '+money(S.fine), 'bad']);
  if(S.o2 < 75) chips.push(['😮‍💨 Душно: '+Math.round(S.o2)+'%', 'bad']);
  if(S.roomT > 26) chips.push(['🥵 В кабинете '+Math.round(S.roomT)+'°', 'warm']);
  if(S.rad==='bubble') chips.push(['🫧 Нужно стукнуть', 'warn']);
  var key = chips.map(function(c){return c[0];}).join('|');
  if(key !== lastRendered.chips){
    el.chips.innerHTML = chips.map(function(c){ return '<span class="chip '+c[2]+'">'+c[0]+'</span>'; }).join('');
    el.chips.style.display = chips.length ? 'flex' : 'none';
    lastRendered.chips = key;
  }

  el.btnHat.classList.toggle('on', S.hat);
  el.player.classList.toggle('wearing', !!S.hat);
  el.scene.classList.toggle('hatted', !!S.hat);
  el.scene.classList.toggle('dizzy', S.overheat >= 70);
  el.btnKnock.disabled = S.rad !== 'bubble';
  el.btnKnock.classList.toggle('on', S.rad === 'bubble');
  el.btns.forEach(function(b){
    var act = b.getAttribute('data-act');
    if(!ACT[act]) return;
    var left = S.cds[act] - S.t, cd = b.querySelector('.cd');
    var frac = left > 0 ? clamp(left/(ACT[act].cd/CFG.MS_PER_MIN),0,1) : 0;
    if(cd) cd.style.height = (frac*100)+'%';
    b.disabled = left > 0;
  });
}

/* ============================ БАТАРЕЯ ============================ */
function weighted(w){
  var total=0,k;
  for(k in w) total += w[k];
  var x = Math.random()*total;
  for(k in w){ x -= w[k]; if(x<=0) return k; }
  return 'low';
}
function pickRadiator(force){
  var hour = (CFG.DAY_START + S.t)/60;
  var w = { cold:34, low:22, hot:13, bubble:31 };
  if(hour >= 11 && hour < 14){ w.hot += 6; w.bubble += 6; }
  if(hour >= 15.5){ w.hot += 6; }
  var key = force || weighted(w);
  S.rad = key;
  S.radLeft = rand(45,95);
  if(key==='hot') speech(pick(HOT_LINES));
  else if(key==='cold') speech(pick(COLD_LINES));
  else if(key==='bubble') speech('Батарея зашумела — надо стукнуть');

/* ============================ ЦИКЛ ============================ */
var raf = null;
function loop(ts){
  raf = requestAnimationFrame(loop);
  if(!S.lastReal){ S.lastReal = ts; return; }
  var dt = Math.min(ts - S.lastReal, 250);
  S.lastReal = ts;
  if(S.over || S.paused) return;
  step(dt);
  render();
}

function step(dtMs){
  var dmin = dtMs / CFG.MS_PER_MIN;
  S.t += dmin;

  S.radLeft -= dmin;
  if(S.radLeft <= 0) pickRadiator();
  S.effects = S.effects.filter(function(e){ return e.until > S.t; });
  if(S.vent && !getEff('vent')){ S.vent = false; }   // «десять минут» истекли
  // температура в кабинете и кислород
  var target = 19;
  if(S.rad === 'hot') target += 3.5;
  if(S.rad === 'cold') target -= 3.2;
  if(S.heaterOn) target += 5.5;
  if(S.vent) target -= 5;
  S.roomT += (target - S.roomT) * 0.02 * dmin;
  S.roomT = clamp(S.roomT, 8, 34);

  var o2rate = S.vent ? 0.4 : -0.055;
  if(S.heaterOn) o2rate -= 0.14;
  S.o2 = clamp(S.o2 + o2rate * dmin, 35, 100);

  if(S.heaterOn){
    S.heaterMin += dmin;
    S.fineRate = 600 * Math.pow(1.9, S.heaterMin / 30);   // штраф растёт экспоненциально
    S.fine += S.fineRate * dmin;
    if(!getEff('heater')){ S.heaterOn = false; }
    // чем дольше греешь, тем выше шанс выбить пробки
    var fuseRisk = 0.0007 * Math.pow(1.65, Math.max(0, S.heaterMin - 20) / 10);
    if(Math.random() < fuseRisk * dmin){ blackout(); }
  }

  if(S.darkUntil > S.t && !getEff('dark')){
    setEff('dark','Света нет',-0.05, S.darkUntil - S.t);
  }
  if(S.darkUntil && S.darkUntil <= S.t){
    S.darkUntil = 0;
    delEff('dark');
    toast('💡 Свет дали. Электрик что-то пробормотал','good');
  }

  if(S.walk){
    S.walk.left -= dmin;
    if(S.t >= S.walk.nextLineAt && S.walk.lines.length){
      setWalkLine(S.walk.lines.shift());
      S.walk.nextLineAt = S.t + rand(7,12);
    }
    updateWalkUI();
    if(S.walk.left <= 0) finishWalk();
  }

  updateColleague(dmin);

  var rate;
  if(S.walk) rate = S.hat ? -0.42 : -0.62;
  else {
    rate = effectsRates();
    if(S.hat && rate < 0) rate *= 0.78;
    if(S.roomT > 26.5) rate -= 0.05;      // перегрев: душно и вяло
    if(S.roomT < 15)   rate -= 0.06;      // кабинет совсем выстыл
    if(S.o2 < 78)      rate -= 0.04;      // душно без кислорода
    if(S.o2 < 66)      rate -= 0.09;
    if(S.darkUntil > S.t) rate -= 0.05;   // в темноте зябко
  }
  S.stat.maxRoomT = Math.max(S.stat.maxRoomT, S.roomT);
  S.stat.minO2 = Math.min(S.stat.minO2, S.o2);
  S.warmth += rate * dmin;
  S.stat.minWarmth = Math.min(S.stat.minWarmth, S.warmth);
  S.stat.maxWarmth = Math.max(S.stat.maxWarmth, S.warmth);
  if(S.hat) S.stat.hatMin += dmin;

  // перегрев: в шапке тепло копится, без шапки остывает
  if(S.hat) S.overheat += (0.55 + Math.max(0, S.warmth - 40) / 60 * 1.5 + (S.walk ? 0.15 : 0)) * dmin;
  else      S.overheat -= 3.0 * dmin;
  S.overheat = clamp(S.overheat, 0, 100);
  S.stat.maxOverheat = Math.max(S.stat.maxOverheat || 0, S.overheat);
  if(S.overheat >= 100){ endGame('overheat'); return; }
  if(S.overheat >= 88 && S.overheatStage < 4){
    S.overheatStage = 4;
    speech('😵 В глазах темнеет… шапку, срочно');
    vib([20,40,20]);
  } else if(S.overheat >= 70 && S.overheatStage < 3){
    S.overheatStage = 3;
    speech('🥵 Голова кружится. Это шапка');
    toast('🥵 Перегрев: сними шапку','bad');
  } else if(S.overheat >= 45 && S.overheatStage < 2){
    S.overheatStage = 2;
    speech('🔥 В шапке жарко, но потери меньше');
  }
  if(S.overheat < 30 && S.overheatStage > 0) S.overheatStage = 0;

  if(S.t >= S.nextAmbientAt){
    speech(pick(AMBIENT));
    S.nextAmbientAt = S.t + rand(18,32);
  }
  if(S.t >= S.nextSpeechAt){
    var sp;
    if(S.walk) sp = pick(CORRIDOR);
    else if(S.warmth < 25) sp = pick(['Х-х-холодно…','Пальцы… не… гнутся…','Может, пуховик?','Шарф спасёт всех']);
    else if(S.rad==='hot') sp = pick(['Блаженство.','Тё-ё-ёпло.','Радиатор — мой друг']);
    else if(S.warmth > 80) sp = pick(['Даже жарко!','Форточку бы открыть','Как в Сочи']);
    else sp = pick(AMBIENT);
    speech(sp);
    S.nextSpeechAt = S.t + rand(14,24);
  }

  if(!S.walk && S.t >= S.nextEventAt) triggerEvent();

  if(S.warmth <= 0){ endGame('frozen'); return; }
  if(S.warmth >= 100) S.warmth = 100;
  if(S.t >= CFG.DAY_END-CFG.DAY_START){ endGame('done'); return; }
}

function seatColleague(){

function unseatColleague(){
  el.colleague.classList.remove('seated');

}

function updateColleague(dmin){
  var c = S.col;
  if(c.walking) return;
  c.timer -= dmin;
  if(c.timer > 0) return;

  var r = Math.random();
  if(r < 0.30){
    // встал и пошёл к окну (может открыть форточку)
    c.mood = 'window';
    unseatColleague();
    goToColleague(ri(38,46), function(){
      if(!S.vent){
        S.vent = true;
        setEff('vent','Открыта форточка',-0.30,600);
        colleagueSay('«'+pick(COLLEAGUE_LINES.window)+'»');
        speech('Форточку бы прикрыть…');
      } else {
        colleagueSay('«'+pick(COLLEAGUE_LINES.window)+'»');
      }
      setTimeout(backToDesk, 9000);
    });
  } else if(r < 0.44){
    // отошёл к батарее
    c.mood = 'radiator';
    unseatColleague();
    goToColleague(RAD_SPOT, function(){
      colleagueSay('«'+pick(COLLEAGUE_LINES.radiator)+'»');
      setTimeout(backToDesk, 8000);
    });
  } else if(r < 0.55){
    // прошёлся по кабинету
    c.mood = 'pass';
    unseatColleague();
    goToColleague(ri(FLOOR_MIN, 50), function(){
      colleagueSay('«'+pick(COLLEAGUE_LINES.pass)+'»');
      setTimeout(backToDesk, 7000);
    });
  } else {
    // сидит за столом и что-то говорит
    seatColleague();
    c.timer = rand(20,40);
    if(Math.random() < 0.5) colleagueSay('«'+pick(COLLEAGUE_LINES.pass)+'»');
  }
}
function goToColleague(x, onArrive){
  var c = S.col;
  c.flip = x < c.target;
  c.target = x;
  c.walking = true;
  el.colleague.classList.add('walking');
  el.colleague.classList.toggle('flip', c.flip);
  el.colleague.style.left = x + '%';
  setTimeout(function(){
    c.walking = false;
    el.colleague.classList.remove('walking');
    if(onArrive) onArrive();
    c.timer = rand(16,30);
  }, 2700);

/* ============================ ДЕЙСТВИЯ ============================ */
function cdLeft(a){ return S.cds[a] - S.t; }
function doAct(act){
  if(S.over || S.walk) return;
  if(act === 'hat'){ toggleHat(); return; }
  if(act === 'window'){ closeVent(); return; }
  if(act === 'knock'){ if(S.rad === 'bubble' && !S.paused) bubbleTiming(); return; }
  if(S.paused) return;
  if(!ACT[act] || cdLeft(act) > 0) return;
  S.cds[act] = S.t + ACT[act].cd/CFG.MS_PER_MIN;
  S.warmth = clamp(S.warmth + ACT[act].gain, 0, 100);
  S.stat[act]++;
  vib(12);
  var b = document.querySelector('.btn[data-act="'+act+'"]');
  if(b){ b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); }
  if(act==='tea') speech('Стакан №'+S.stat.tea+' — уже теплее');
  if(act==='squats') speech('Двадцать приседаний. Коллега не оценил');
  if(act==='breathe') speech('Подышал на руки. Ненадолго');
  render();
}
function toggleHat(){
  S.hat = !S.hat;
  vib(12);
  if(S.hat){
    S.warmth = clamp(S.warmth+2,0,100);
    speech('Шапка надета: потери −22%. Только не запарься');
    if(Math.random() < 0.3){ S.stat.awkward++; colleagueSay('«Это вообще рабочий день?»'); }
  } else {
    speech('Шапка снята. Голова остывает');
  }
  if(!S.paused) render();
}
/* ============================ ОБОГРЕВАТЕЛЬ В РОЗЕТКУ ============================ */
function toggleHeater(){
  if(S.over || S.walk || S.paused) return;
  if(S.heaterOn){ heaterOff(); return; }
  if(S.t < S.heaterBanned){
    toast('🔌 Электрик забрал обогреватель до конца дня','warn');
    return;
  }
  plugHeater();
}
function blackout(){
  S.stat.blackouts++;
  S.fine += 70000;
  S.heaterOn = false;
  S.heaterMin = 0;
  delEff('heater');
  S.heaterBanned = S.t + 420;
  S.darkUntil = S.t + rand(50, 95);
  pickRadiator('cold'); S.radLeft = Math.max(S.radLeft, 100);
  vib([60,40,60]);
  toast('💥 Пробки выбило! Свет погас: штраф 70 000 ₽','bad');
  speech('Темно-то как…');
  render();
}
function plugHeater(force){
  var boom = force === 'boom' || (force !== 'ok' && Math.random() < 0.32);
  vib(22);
  if(boom){
    speech('Ой. Я этого не делал');
    blackout();
  } else {
    S.heaterOn = true;
    setEff('heater','Обогреватель включён',+0.46,300);
    toast('🔌 Обогреватель включён. Счётчик крутится','warn');
    speech('Сейчас согреемся');
  }
  render();
}
function heaterOff(){
  S.heaterOn = false;
  delEff('heater');
  toast('🔌 Обогреватель выключен, счётчик остановлен','good');

/* ============================ ТАЙМИНГ-МИНИ-ИГРА ============================ */
/* opt: {title, text, button, hint, tries, zoneW, period, onHit, onMiss, onSkip, skip} */
var TAP_LATENCY = 260;   // мс: пока палец долетает до экрана, маркер успевает уехать
function timingModal(opt){
  S.paused = true;
  S.stat.timings++;
  var tries = opt.tries || 1, zoneW = opt.zoneW || 0.26, period = opt.period || 3000;
  var zoneStart = rand(0.34, 0.5);
  var started = performance.now(), rafId = null, closed = false;

  el.card.innerHTML =
    '<h2>'+opt.title+'</h2>'+
    '<p>'+opt.text+'</p>'+
    '<div class="timing"><div class="zone" style="left:'+(zoneStart*100)+'%;width:'+(zoneW*100)+'%"></div><div class="mk" id="mk"></div></div>'+
    '<div class="tries" id="tries">'+(tries>1 ? '🔨'.repeat(tries) : '<span class="hintline">'+(opt.hint||'нажми в зелёной зоне')+'</span>')+'</div>'+
    '<button class="cta" id="knockBtn">'+opt.button+'</button>'+
    (opt.skip ? '<button class="cta ghost" id="giveUpBtn">'+opt.skip+'</button>' : '');
  el.overlay.classList.add('show');
  vib(20);

  function pos(){
    var ph = ((performance.now()-started)/period) % 1;
    return ph < 0.5 ? ph*2 : 2-ph*2;
  }
  function mark(){
    var mk = $('mk');
    var pp = pos();
    if(mk) mk.style.left = (pp*100)+'%';
    window.__timingDbg = {p:pp, zoneStart:zoneStart, zoneW:zoneW, t:performance.now()};
    rafId = requestAnimationFrame(mark);
  }
  mark();

  function finish(){
    if(closed) return;
    closed = true;
    cancelAnimationFrame(rafId);
    el.overlay.classList.remove('show');
    el.card.innerHTML = '';
    S.paused = false;
    render();
  }
  /* маркер за последние TAP_LATENCY мс мог пройти зону — это тоже попадание */
  function wasInZone(now){
    for(var dt = 0; dt <= TAP_LATENCY; dt += 8){
      var ph = ((now - dt - started) / period) % 1;
      if(ph < 0) continue;
      var pp = ph < 0.5 ? ph * 2 : 2 - ph * 2;
      if(pp >= zoneStart && pp <= zoneStart + zoneW) return true;
    }
    return false;
  }
  $('knockBtn').onclick = function(){
    if(closed) return;
    var p = pos();
    var hit = wasInZone(performance.now()) || (p >= zoneStart && p <= zoneStart+zoneW)
              || window.__forceTimingHit === true || window.__forceKnockHit === true;
    if(hit){
      S.stat.timingHits++;
      finish();
      if(opt.onHit) opt.onHit();
      return;
    }
    tries--; S.stat.misses++;
    if(tries <= 0){
      finish();
      if(opt.onMiss) opt.onMiss();
    } else {
      zoneStart = rand(0.36, 0.64);
      el.card.querySelector('.zone').setAttribute('style','left:'+(zoneStart*100)+'%;width:'+(zoneW*100)+'%');
      $('tries').textContent = '🔨'.repeat(tries);
      toast('Мимо! Ещё раз','warn');
      vib(40);
    }
  };
  if(opt.skip) $('giveUpBtn').onclick = function(){
    if(closed) return;
    S.stat.misses++;
    finish();
    if(opt.onSkip) opt.onSkip();
  };
}

function triggerEvent(){
  S.nextEventAt = S.t + rand(285,495);
  var pool = EVENTS.filter(function(e){ return e.when(); });
  if(!pool.length) return;
  var total = 0; pool.forEach(function(e){ total += e.weight; });
  var x = Math.random()*total, chosen = pool[0];
  for(var i=0;i<pool.length;i++){ x -= pool[i].weight; if(x<=0){ chosen = pool[i]; break; } }
  showEvent(chosen);
}
function byId(id){ return EVENTS.filter(function(e){ return e.id === id; })[0]; }

function showEvent(ev, skipVisit){
  S.stat.events++;
  vib(25);
  if(ev.withVisitor && !skipVisit && !S.visitorIn){
    visitThen(function(){ renderEvent(ev); });
    return;
  }
  renderEvent(ev);
}

function renderEvent(ev){
  S.paused = true;
  var html = '';
  if(ev.messenger){
    html += '<h2 style="margin-bottom:8px">'+ev.title+'</h2>';
    html += '<div class="messenger"><div class="msgr-head"><span class="ava">'+(ev.messenger.ava||'💬')+'</span>'+
            '<div><b>'+ev.messenger.title+'</b><span>'+(ev.messenger.sub||'онлайн')+'</span></div></div><div class="msgr-body">';
    ev.messenger.messages.forEach(function(m,i){
      html += '<div class="bubble'+(m.me?' me':'')+'" style="animation-delay:'+(0.12+i*0.5).toFixed(2)+'s">'+m.t+'</div>';
    });
    html += '<div class="bubble typing" style="animation-delay:'+(0.12+ev.messenger.messages.length*0.5).toFixed(2)+'s">печатает…</div>';
    html += '</div></div>';
  } else {
    html += '<h2>'+ev.title+'</h2>';
    if(ev.text) html += '<p>'+ev.text+'</p>';
  }
  ev.opts.forEach(function(o,i){
    html += '<button class="opt'+(i===0?' primary':'')+'" data-i="'+i+'">'+o.label+(o.sub?'<small>'+o.sub+'</small>':'')+'</button>';
  });
  el.card.innerHTML = html;
  el.overlay.classList.add('show');
  Array.prototype.forEach.call(el.card.querySelectorAll('.opt'), function(b){
    b.onclick = function(){
      el.overlay.classList.remove('show');
      S.paused = false;
      var o = ev.opts[parseInt(b.getAttribute('data-i'),10)];
      try{ o.run(); }catch(e){}
      render();
      if(S.visitorIn) setTimeout(function(){ if(!S.over) visitorExit(); }, 1400);
    };
  });
}

function startWalk(minutes, label, onArrive){
  S.walk = {
    left:minutes, total:minutes, label:label,
    lines:shuffle(CORRIDOR.slice()), nextLineAt:S.t+3, onArrive:onArrive||null
  };
  S.stat.corridors++;
  el.card.innerHTML =
    '<div class="walk">'+
      '<div class="walker">🚶</div>'+
      '<h2 style="text-align:center;margin-top:6px">'+label+'</h2>'+
      '<p style="text-align:center">В коридоре холодно: тепло уходит быстрее, кнопки грелок не работают.</p>'+
      '<div class="timing" style="height:12px"><div class="mk" id="walkMk" style="width:6px"></div></div>'+
      '<div class="wline" id="wline">…</div>'+
      '<div class="snow" id="snow"></div>'+
    '</div>';
  el.overlay.classList.add('show');
  var snow = $('snow'), flakes = '';
  for(var i=0;i<12;i++){
    flakes += '<i style="left:'+ri(3,95)+'%;animation-duration:'+rand(2.4,5.4).toFixed(1)+'s;animation-delay:'+rand(0,3).toFixed(1)+'s">❄</i>';
  }
  snow.innerHTML = flakes;
  setWalkLine('🚪 Дверь кабинета закрылась. Пошёл.');
}
function setWalkLine(text){
  var w = $('wline');
  if(!w) return;
  w.textContent = text;
  w.style.animation = 'none'; void w.offsetWidth; w.style.animation = 'pop .4s cubic-bezier(.2,1.6,.4,1)';
}
function updateWalkUI(){
  var mk = $('walkMk');
  if(mk && S.walk) mk.style.left = (100 - S.walk.left/S.walk.total*100)+'%';
}
function finishWalk(){
  var w = S.walk;
  S.walk = null;
  el.overlay.classList.remove('show');
  S.warmth = clamp(S.warmth + 1.5, 0, 100);
  speech('Вернулся. Тут всё так же');
  if(w && w.onArrive){ try{ w.onArrive(); }catch(e){} }
  render();
}

  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); return true; } }catch(e){}
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function wrapText(ctx, text, px, py, maxW, lh){
  var words = String(text).split(' '), line = '', y = py;
  for(var i=0;i<words.length;i++){
    var test = line ? line+' '+words[i] : words[i];
    if(ctx.measureText(test).width > maxW && line){ ctx.fillText(line, px, y); line = words[i]; y += lh; }
    else line = test;
  }
  if(line) ctx.fillText(line, px, y);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ============================ СТАРТ / СПРАВКА ============================ */
function start(){
  resetState();
  lastRendered = {rad:'', chips:''};
  el.overlay.classList.remove('show');
  el.toasts.innerHTML = '';
  el.card.innerHTML = '';
  el.colleague.className = 'colleague seated';
  if(el.colleagueFace) el.colleagueFace.textContent = COLLEAGUE_SIT;
  el.colleague.style.left = DESK_SPOT + '%';
  el.visitor.className = 'visitor';
  S.visitorIn = false;
  pickRadiator('low');
  S.radLeft = rand(35,55);
  speech('Рабочий день. Посмотрим, что с отоплением');
  S.lastReal = 0;
  render();
}
function ruleTile(em,title,text){
  return '<div class="rule"><span>'+em+'</span><b>'+title+'</b><i>'+text+'</i></div>';
}
function showHelp(fromStart){
  S.paused = true;
  el.card.innerHTML =
    '<h2>Как играть</h2>'+
    '<p>Дожить с 9:00 до 18:00 и не замёрзнуть. В конце — титул, цитата и карточка для чата.</p>'+
    '<div class="rulegrid">'+
      ruleTile('☕','Грелки','Чай, приседы и дыхание на руки. У каждой своя перезарядка.')+
      ruleTile('🧣','Шапка','Потери тепла −22 %. Но в шапке копится перегрев: пересидишь — «Перегрелся».')+
      ruleTile('🫧','Пробка','Батарея шумит — жми 🔨 и попади в зелёную зону.')+
      ruleTile('🪟','Форточка','Коллега открывает, ты закрываешь: тап по окну.')+
      ruleTile('🎯','Тайминг','В спорных событиях решает момент нажатия.')+
      ruleTile('🚶','Коридор','В пути грелки не работают — только идти и терпеть.')+
      ruleTile('🔌','Обогреватель','Тап по обогревателю: греет сильно, но счётчик растёт всё быстрее. Долго греешь — выбьет пробки, погаснет свет и придёт штраф.')+
      ruleTile('💨','Воздух и духота','Кислород падает весь день, а обогреватель сжигает его быстрее. В духоте мёрзнешь сильнее — открывай форточку, но она холодит кабинет.')+
    '</div>'+
    '<button class="cta" id="helpOk">'+(fromStart ? 'Поехали' : 'Продолжить')+'</button>';
  el.overlay.classList.add('show');
  $('helpOk').onclick = function(){
    el.overlay.classList.remove('show');
    if(fromStart) start(); else S.paused = false;
  };
}

/* ============================ СТАРТ ============================ */
function boot(){
  cacheEl();
  el.officeName.textContent = CFG.OFFICE;
  document.title = 'Дожить до 18:00 · '+CFG.OFFICE;
  resetState();
  pickRadiator('low');
  render();

  el.btns.forEach(function(b){
    var act = b.getAttribute('data-act');
    b.addEventListener('click', function(){ doAct(act); });
  });
  el.windowEl.addEventListener('click', function(){
    if(S.over || S.walk || S.paused) return;
    if(S.vent) closeVent(); else openVent(true);
  });
  el.rad.addEventListener('click', function(){
    if(S.over || S.walk || S.paused) return;
    if(S.rad === 'bubble') bubbleTiming();
    else speech('Батарея как батарея. Пока ничего не решает');
  });
  el.heaterObj.addEventListener('click', function(){ toggleHeater(); });
  var posterEl = document.querySelector('.poster');
  if(posterEl) posterEl.addEventListener('click', function(){
    if(S.over || S.walk || S.paused) return;
    speech('График отопления. Реквизит, а не документ');
  });
  $('helpBtn').addEventListener('click', function(){ if(!S.over) showHelp(false); });
  document.addEventListener('visibilitychange', function(){ S.lastReal = 0; });

  S.paused = true;
  showHelp(true);
  raf = requestAnimationFrame(loop);

  window.__game = {
    S:function(){ return S; },
    act:doAct, step:step, render:render,
    vent:function(open){ if(open) openVent(true); else closeVent(); },
    colleague:function(mood){
      if(mood === 'window'){
        goToColleague(16, function(){
          if(!S.vent){ S.vent = true; setEff('vent','Открыта форточка',-0.30,600); }
          render();
        });
      } else goToColleague(62, null);
    },
    event:function(id, skipVisit){ var ev = byId(id); if(ev) showEvent(ev, skipVisit); },
    visitor:visitorEnter,
    say:function(who, text){ if(who === 'colleague') colleagueSay(text); else speech(text); },
    heater:function(force){ if(S.heaterOn) heaterOff(); else plugHeater(force); },
    ventFight:function(){ showEvent(byId('ventfight'), true); },
    choice:function(i){ var b = el.card.querySelector('.opt[data-i="'+i+'"]'); if(b) b.click(); },
    timing:function(hit){ window.__forceTimingHit = hit !== false; var b = $('knockBtn'); if(b) b.click(); window.__forceTimingHit = false; },
    walk:function(minutes,label){ S.paused = false; startWalk(minutes||40, label||'🚶 Коридор', null); },
    finish:function(){ if(S.walk){ S.walk.left = 0; finishWalk(); } },
    end:function(reason){ S.paused = false; endGame(reason||'done'); },
    share:shareText, card:downloadCard
  };
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
